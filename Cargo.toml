[package]
name = "proton-pass-sync"
version = "0.1.0"
edition = "2021"
rust-version = "1.80"
description = "A read-only Proton Pass to GNU pass offline mirror"
license = "MIT"
repository = "https://github.com/Napolitain/proton-pass-sync"

[dependencies]
anyhow = "1.0"
base64 = "0.22"
chrono = { version = "=0.4.45", default-features = false, features = ["std", "serde"] }
clap = { version = "=4.5.50", features = ["derive"] }
fs2 = "0.4"
rlimit = "0.10"
semver = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
tempfile = "=3.14.0"
toml = "=0.8.23"
# Keep toml_edit's otherwise-loose transitive range compatible with Rust 1.80.
indexmap = "=2.11.4"
unicode-normalization = "0.1"
wait-timeout = "0.2"
walkdir = "2.5"
zeroize = { version = "=1.8.1", features = ["derive"] }
# Keep zeroize's otherwise-loose proc-macro range compatible with Rust 1.80.
zeroize_derive = "=1.4.2"

[dev-dependencies]
assert_cmd = "=2.0.16"
predicates = "3.1"

[profile.release]
lto = "thin"
strip = true

[lints.rust]
unsafe_code = "deny"

[lints.clippy]
all = "deny"
pedantic = "warn"
